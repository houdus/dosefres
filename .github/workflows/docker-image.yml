# ===========================================================================
# AtlasSync C2 — encrypted-source image build (r20)
#
# For a repo where the source is NOT stored in cleartext: you upload only a
# 7-Zip AES-encrypted archive (linux.zip) of the linux kit, plus this file at
# .github/workflows/build.yaml.
#
# Trigger: Actions tab -> "Build AtlasSync image (encrypted source)" ->
# Run workflow -> it PROMPTS for the archive password (plus options).
# The password is masked in every log line; the runner VM is destroyed after
# the job, so the decrypted source never persists anywhere.
#
# Output: ghcr.io/<owner>/<repo>:<tag> (private by default) — deploy it on
# any platform that takes prebuilt images (Render "existing image",
# Railway "Deploy Docker Image", Fly, a VPS with docker).
#
# Pack the archive (Windows, 7-Zip installed):
#     7z a -t7z -mx=9 -p linux.zip .\linux\*
# (or from the parent of the linux folder: 7z a -t7z -mx=9 -p linux.zip linux)
# Both layouts are detected: the archive with the linux/ folder inside, or
# the folder's contents at the archive root.
#
# PUSH CREDENTIALS (r20 fix for "error from registry: denied"):
#   GHCR can accept every image LAYER and then deny the final manifest with
#   "denied" when the package already exists but is NOT linked to this
#   repository (created earlier by a manual `docker push` from your machine).
#   Two ways to guarantee the push succeeds:
#     * default: the built-in GITHUB_TOKEN — this workflow declares
#       packages:write below; it creates and pushes the package as long as
#       no unlinked package of the same name exists;
#     * bulletproof: a classic PAT with write:packages saved as the GHCR_PAT
#       repository secret (Settings -> Secrets and variables -> Actions).
#       The workflow tries it FIRST — a PAT can always push to your own
#       package, linked or not.
#
# Notes:
#   - workflow_dispatch input values are visible to repo collaborators on
#     the run page. Keep the repo private, or leave the input empty and put
#     the password in the ZIP_PASSWORD repository secret instead.
# ===========================================================================
name: Build AtlasSync image (encrypted source)

on:
  workflow_dispatch:
    inputs:
      zip_password:
        description: "Archive password (leave empty to use the ZIP_PASSWORD repo secret)"
        required: false
        default: ""
      zip_path:
        description: "Path to the encrypted archive inside the repo"
        required: false
        default: "linux.zip"
      run_tests:
        description: "Run the Go test suite before building"
        type: boolean
        required: false
        default: true
      image_tag:
        description: "Image tag to push to ghcr.io"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo (archive + this workflow only)
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Unpack the encrypted source (password prompted at trigger)
        env:
          INPUT_PASSWORD: ${{ inputs.zip_password }}
          SECRET_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          PW="$INPUT_PASSWORD"
          [ -z "$PW" ] && PW="$SECRET_PASSWORD"
          if [ -z "$PW" ]; then
            echo "::error::no password provided (workflow input or ZIP_PASSWORD repo secret)"
            exit 1
          fi
          echo "::add-mask::$PW"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::$ZIP_PATH not found in the repo — upload the encrypted archive first"
            exit 1
          fi
          mkdir -p src
          # wrong password -> 7z exits non-zero and prints CRC errors
          7z x -y -p"$PW" -osrc "$ZIP_PATH" > /dev/null 2>&1 || {
            echo "::error::extraction failed — wrong password or corrupt archive"
            exit 1
          }
          echo "archive unpacked on the ephemeral runner"

      - name: Locate the Docker build context
        id: ctx
        run: |
          if   [ -f src/linux/Dockerfile ]; then echo "dir=src/linux" >> "$GITHUB_OUTPUT"
          elif [ -f src/Dockerfile ];         then echo "dir=src"      >> "$GITHUB_OUTPUT"
          else
            echo "::error::no Dockerfile inside the archive (expected linux/Dockerfile or Dockerfile)"
            exit 1
          fi

      - name: Set up go1.27.2
        if: ${{ inputs.run_tests }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Test the module (vendored, no network)
        if: ${{ inputs.run_tests }}
        working-directory: ${{ steps.ctx.outputs.dir }}
        run: go vet ./... && go test ./...

      - name: Build and push the runtime image to GHCR
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}        # optional, tried first
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # built-in, repo-scoped
        run: |
          # docker image names must be lowercase
          IMAGE="${GHCR_IMAGE,,}"
          TAG="${{ inputs.image_tag }}"
          docker build --target runtime -t "$IMAGE:$TAG" "${{ steps.ctx.outputs.dir }}"

          # push_with <password>: login + push, exit status tells success.
          push_with() {
            echo "$1" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker push "$IMAGE:$TAG"
          }

          # PAT first (it always works on your own packages), then the
          # repo-scoped GITHUB_TOKEN.
          PUSHED=0
          if [ -n "$GHCR_PAT" ] && push_with "$GHCR_PAT"; then
            PUSHED=1
          fi
          if [ "$PUSHED" = 0 ] && push_with "$GHCR_TOKEN"; then
            PUSHED=1
          fi

          if [ "$PUSHED" = 0 ]; then
            echo "::error::push to $IMAGE:$TAG was DENIED — the image build itself succeeded"
            echo "GHCR accepted every layer but refused the manifest: the package exists"
            echo "already but is NOT linked to this repository (it was created earlier by"
            echo "a manual 'docker push' from your machine). ANY one of these fixes it:"
            echo "  A) fastest: github.com -> your avatar -> Your packages -> dosefres ->"
            echo "     Package settings -> Delete this package, then re-run this workflow."
            echo "     The next push recreates it auto-linked to this repo. Nothing of"
            echo "     value is lost — the image is rebuilt from scratch every run."
            echo "  B) keep the package: same Package settings page -> 'Manage Actions"
            echo "     access' -> add this repository with the Write role, then re-run."
            echo "  C) create a classic PAT with write:packages scope, save it as the"
            echo "     GHCR_PAT repository secret (Settings -> Secrets and variables ->"
            echo "     Actions), then re-run — this workflow pushes with it automatically."
            exit 1
          fi

          echo
          echo "image: $IMAGE:$TAG"
          echo "deploy it with C2_ENROLL_SECRET + C2_UI_TOKEN env vars set (container disks are ephemeral)"
